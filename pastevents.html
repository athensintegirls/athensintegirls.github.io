<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Events - INTEGIRLS Athens</title>

<style>
:root {
    --bg-pink: #fdf1f7;
    --title-color: #5f4b5b;
}

body {
    margin: 0;
    background-color: var(--bg-pink);
    font-family: Arial, sans-serif;
}

/* HEADER */
.top-bar {
    width: 100%;
    padding: 20px 30px;
    box-sizing: border-box;
}

.top-bar table {
    width: 100%;
    border-collapse: collapse;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-logo {
    width: 24px;
    height: 24px;
    border-radius: 50%;
}

.site-title {
    font-family: "Brush Script MT", cursive;
    font-size: 1.5rem;
    color: var(--title-color);
}

/* NAV DESKTOP */
.nav-box {
    display: inline-flex;
    gap: 14px;
    background-color: white;
    padding: 12px 18px;
    border-radius: 18px;
    border: 1.5px solid var(--title-color);
}

.nav-box a {
    text-decoration: none;
    color: var(--title-color);
    font-weight: 600;
}

/* MOBILE BUTTON */
.menu-button {
    display: none;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: black;
    border: none;
}

.menu-button span {
    display: block;
    width: 20px;
    height: 2px;
    background: white;
    margin: 4px auto;
}

/* MOBILE MENU */
.mobile-menu-overlay {
    display: none;
}

.mobile-menu-overlay.show {
    display: flex;
}

.mobile-menu-links {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
}

.mobile-menu-links a {
    font-size: 2rem;
    text-decoration: none;
    color: #666;
}

.menu-close {
    position: absolute;
    top: 80px;
    right: 40px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: black;
    color: white;
    font-size: 2rem;
    border: none;
}

/* CONTENT */
.contest-title {
    text-align: center;
    font-size: 42px;
    color: #8b7266;
    margin: 80px 0 25px;
    font-family: Georgia, serif;
}

.inti-gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.inti-gallery img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 40px;
    font-family: Georgia, serif;
}

/* TABLET */
@media (max-width: 900px) {
    .nav-box {
        display: none;
    }

    .menu-button {
        display: inline-block;
    }

    .mobile-menu-overlay {
        position: fixed;
        inset: 0;
        background: rgba(240,240,240,0.96);
        justify-content: center;
        padding-top: 140px;
        z-index: 999;
    }

    .inti-gallery {
        grid-template-columns: repeat(2, 1fr);
    }

    .inti-gallery img {
        height: 230px;
    }

    .contest-title {
        font-size: 34px;
        margin-top: 60px;
    }
}

/* MOBILE */
@media (max-width: 500px) {
    .inti-gallery {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 0 12px;
    }

    .inti-gallery img {
        height: 170px;
        border-radius: 12px;
    }

    .contest-title {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="top-bar">
<table>
<tr>

<td style="text-align: left;">
    <div class="header-left">
        <img src="logo.jpg" class="header-logo">
        <span class="site-title">INTEGIRLS Athens</span>
    </div>
</td>

<td style="text-align: right; vertical-align: middle;">
    <div class="nav-box">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="pastevents.html">Past Events</a>
        <a href="donate.html">Donate</a>
        <a href="team.html">Our Team</a>
        <a href="https://www.integirls.org/">INTEGIRLS</a>
    </div>

    <button class="menu-button" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>
</td>

</tr>
</table>
</div>

<!-- MOBILE MENU -->
<div class="mobile-menu-overlay" id="siteMenu">
<button class="menu-close" onclick="toggleMenu()">✕</button>

<div class="mobile-menu-links">
    <a href="index.html">HOME</a>
    <a href="events.html">EVENTS</a>
    <a href="pastevents.html">PAST EVENTS</a>
    <a href="donate.html">DONATE</a>
    <a href="team.html">OUR TEAM</a>
    <a href="https://www.integirls.org/">INTEGIRLS</a>
</div>
</div>

<!-- CONTENT -->
<h2 class="contest-title">Spring 2026 Contest</h2>

<section class="inti-gallery">
    <img src="intiphoto3.JPG" alt="INTI photo 3">
    <img src="intiphoto4.PNG" alt="INTI photo 4">
    <img src="intiphoto2.jpg" alt="INTI photo 2">
     <img src="intiphoto5.jpg" alt="INTI photo 5">
    <img src="intiphoto6.jpg" alt="INTI photo 6">
    <img src="intiphoto7.jpg" alt="INTI photo 7">
    <img src="intiphoto8.jpg" alt="INTI photo 8">
    <img src="intiphoto9.jpg" alt="INTI photo 9">
    <img src="intiphoto10.jpg" alt="INTI photo 10">
    <img src="intiphoto11.jpg" alt="INTI photo 11">
    <img src="intiphoto12.jpg" alt="INTI photo 12">
    <img src="intiphoto13.jpg" alt="INTI photo 13">
</section>

<!-- FOOTER -->
<div class="footer">
© 2025 INTEGIRLS Athens
</div>

function toggleMenu() {
    document.getElementById("siteMenu").classList.toggle("show");
}
</script>

</body>
</html>
