  .inti-gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  max-width: 1100px;
  margin: 40px auto;
  padding: 0 20px;
}

.inti-gallery img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 16px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
}

/* Tablet */
@media (max-width: 900px) {
  .inti-gallery {
    grid-template-columns: repeat(2, 1fr);
  }

  .inti-gallery img {
    height: 230px;
  }
}

/* Mobile */
@media (max-width: 500px) {
  .inti-gallery {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 12px;
  }

  .inti-gallery img {
    height: 170px;
    border-radius: 12px;
  }
